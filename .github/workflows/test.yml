name: Teste e Relatorio de cobertura

on:
  pull_request:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Coverage
        run: |
          chmod +x gradlew
          ./gradlew jacocoTestReport

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
          dotnet-quality: 'ga'

      - name: ReportGenerator
        uses: danielpalme/ReportGenerator-GitHub-Action@5.3.11
        with:
          reports: ${{ github.workspace }}/build/jacoco.xml
          targetdir: 'coveragereport'
          reporttypes: 'MarkdownSummaryGithub;Badges;HtmlInline'
          verbosity: 'Warning'
          toolpath: 'reportgeneratortool'

      - name: Add Coverage Job Summary
        run: cat coveragereport/SummaryGithub.md > $GITHUB_STEP_SUMMARY

      - name: Upload html
        uses: actions/upload-artifact@v4
        with:
          name: report.index
          path: coveragereport/index.html
          retention-days: 50

      - name: Upload Badge
        uses: actions/upload-artifact@v4
        with:
          name: badge-line-coverage.svg
          path: coveragereport/badge_shieldsio_linecoverage_green.svg
          retention-days: 50
